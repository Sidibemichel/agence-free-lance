<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Horloge multi-fuseaux — Agence IA</title>
  <style>
    /* Design: fond noir #0a0a0a, violet #8b5cf6, moderne et pro */
    :root {
      --bg: #0a0a0a;
      --violet: #8b5cf6;
      --card: rgba(255,255,255,0.03);
      --muted: rgba(255,255,255,0.7);
      --glass-border: rgba(255,255,255,0.04);
      --radius: 12px;
      --gap: 14px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }

    html,body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: #fff;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .wrap {
      max-width: 1100px;
      margin: 28px auto;
      padding: 24px;
    }

    header {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .brand {
      display:flex;
      gap:12px;
      align-items:center;
    }
    .logo {
      width:48px;
      height:48px;
      border-radius:10px;
      display:flex;
      align-items:center;
      justify-content:center;
      background: linear-gradient(135deg, rgba(139,92,246,0.12), rgba(139,92,246,0.06));
      color: var(--violet);
      font-weight:800;
      border:1px solid rgba(139,92,246,0.12);
    }
    h1 { font-size:18px; margin:0; }

    p.lead { margin: 6px 0 0 0; color:var(--muted); font-size:14px; }

    .controls {
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }

    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border: 1px solid var(--glass-border);
      padding: 16px;
      border-radius: var(--radius);
    }

    .grid {
      display:grid;
      grid-template-columns: repeat(3,1fr);
      gap: var(--gap);
      margin-top: 18px;
    }
    @media (max-width: 980px) { .grid { grid-template-columns: repeat(2,1fr); } }
    @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }

    .tz {
      display:flex;
      flex-direction:column;
      gap:8px;
      padding: 14px;
    }

    .tz .label {
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
    }

    .region {
      font-weight:700;
      font-size:14px;
    }
    .tz-name {
      color: var(--muted);
      font-size:13px;
    }

    .time {
      font-size: clamp(20px, 3.8vw, 28px);
      font-weight:800;
      color: #fff;
      letter-spacing: 0.6px;
    }
    .date {
      color: var(--muted);
      font-size:13px;
    }

    /* small form */
    select, input[type="text"], button {
      background: rgba(255,255,255,0.02);
      color: #fff;
      border: 1px solid var(--glass-border);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 14px;
    }
    button.primary {
      background: linear-gradient(90deg, var(--violet), #6d28d9);
      border: none;
      box-shadow: 0 6px 16px rgba(139,92,246,0.12);
      cursor: pointer;
      font-weight:700;
      color: #fff;
    }
    button.ghost {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.04);
      color: var(--muted);
      cursor:pointer;
    }

    .controls .small { font-size:13px; color:var(--muted); }

    .footer-note {
      margin-top:18px;
      color:var(--muted);
      font-size:13px;
    }

    .remove-btn {
      background: transparent;
      border: none;
      color: rgba(255,255,255,0.5);
      cursor: pointer;
      padding: 6px;
      border-radius:6px;
    }
    .remove-btn:hover { color: #ffb3b3; background: rgba(255,255,255,0.02); }

    /* Accessibility focus */
    select:focus, input:focus, button:focus, .remove-btn:focus {
      outline: 3px solid rgba(139,92,246,0.18);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <div class="logo">IA</div>
        <div>
          <h1>Horloge multi-fuseaux</h1>
          <p class="lead">Affiche l'heure actuelle dans plusieurs fuseaux horaires (IANA)</p>
        </div>
      </div>

      <div class="controls">
        <label class="small">Fuseau par défaut:</label>
        <select id="presetSelect" aria-label="Choisir un fuseau">
          <!-- Preset options added by JS for brevity -->
        </select>

        <div style="display:flex; gap:8px; align-items:center;">
          <input id="customTz" type="text" placeholder="Ex: Europe/Paris" aria-label="Fuseau personnalisé" />
          <button id="addBtn" class="primary">Ajouter</button>
        </div>
      </div>
    </header>

    <section id="clocks" class="grid" aria-live="polite" aria-label="Horloges">
      <!-- Time zone cards injected by JS -->
    </section>

    <div class="footer-note">
      Astuce: pour ajouter un fuseau IANA, utilisez le format "Continent/Ville" (ex: "America/New_York", "Asia/Tokyo").
    </div>
  </div>

  <script>
    // Liste initiale de fuseaux utiles
    const defaultTimeZones = [
      { id: 'local', label: 'Heure locale' },          // will use user's locale
      { id: 'UTC', label: 'UTC' },
      { id: 'Europe/Paris', label: 'Paris (Europe/Paris)' },
      { id: 'Europe/London', label: 'Londres (Europe/London)' },
      { id: 'America/New_York', label: 'New York (America/New_York)' },
      { id: 'America/Los_Angeles', label: 'Los Angeles (America/Los_Angeles)' },
      { id: 'Asia/Tokyo', label: 'Tokyo (Asia/Tokyo)' },
      { id: 'Australia/Sydney', label: 'Sydney (Australia/Sydney)' }
    ];

    // Map to keep current zones (keyed by timezone id). We keep order in array
    let zones = [...defaultTimeZones];

    const presetSelect = document.getElementById('presetSelect');
    const customInput = document.getElementById('customTz');
    const addBtn = document.getElementById('addBtn');
    const clocksContainer = document.getElementById('clocks');

    // Populate the preset select with a subset of common zones
    const commonZones = [
      'UTC',
      'Europe/Paris',
      'Europe/London',
      'America/New_York',
      'America/Los_Angeles',
      'Asia/Tokyo',
      'Asia/Shanghai',
      'Asia/Kolkata',
      'Australia/Sydney',
      'Pacific/Auckland'
    ];
    commonZones.forEach(tz => {
      const opt = document.createElement('option');
      opt.value = tz;
      opt.textContent = tz;
      presetSelect.appendChild(opt);
    });
    presetSelect.value = 'Europe/Paris';

    // Utility: formats for time & date
    function formatForZone(date, timeZone) {
      // If 'local', do not pass timeZone to use user's locale/timezone
      const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false, timeZone: timeZone === 'local' ? undefined : timeZone };
      const dateOptions = { weekday: 'short', year: 'numeric', month: 'short', day: '2-digit', timeZone: timeZone === 'local' ? undefined : timeZone };
      const timeStr = new Intl.DateTimeFormat(undefined, timeOptions).format(date);
      const dateStr = new Intl.DateTimeFormat(undefined, dateOptions).format(date);
      return { timeStr, dateStr };
    }

    // Render all zone cards
    function renderZones() {
      clocksContainer.innerHTML = '';
      zones.forEach((zone, idx) => {
        const card = document.createElement('div');
        card.className = 'card tz';
        card.setAttribute('data-tz', zone.id);

        // header: region name + remove button (except local)
        const header = document.createElement('div');
        header.className = 'label';

        const left = document.createElement('div');
        const region = document.createElement('div');
        region.className = 'region';
        region.textContent = zone.label || zone.id;
        const tzname = document.createElement('div');
        tzname.className = 'tz-name';
        tzname.textContent = zone.id === 'local' ? Intl.DateTimeFormat().resolvedOptions().timeZone || 'Local' : zone.id;
        left.appendChild(region);
        left.appendChild(tzname);

        const controls = document.createElement('div');
        // allow changing format (24/12) later (not implemented) or removing
        const removeBtn = document.createElement('button');
        removeBtn.className = 'remove-btn';
        removeBtn.title = 'Supprimer ce fuseau';
        removeBtn.setAttribute('aria-label', `Supprimer ${zone.id}`);
        removeBtn.innerHTML = '✕';
        removeBtn.onclick = () => {
          zones = zones.filter(z => z.id !== zone.id);
          renderZones();
        };
        controls.appendChild(removeBtn);

        header.appendChild(left);
        header.appendChild(controls);

        const timeEl = document.createElement('div');
        timeEl.className = 'time';
        timeEl.setAttribute('aria-live', 'polite');
        timeEl.textContent = '—:—:—';

        const dateEl = document.createElement('div');
        dateEl.className = 'date';
        dateEl.textContent = '';

        card.appendChild(header);
        card.appendChild(timeEl);
        card.appendChild(dateEl);

        clocksContainer.appendChild(card);
      });
      // Immediately update to show current times
      updateTimes();
    }

    // Update function called every second
    function updateTimes() {
      const now = new Date();
      document.querySelectorAll('.tz').forEach(card => {
        const tz = card.getAttribute('data-tz');
        try {
          const { timeStr, dateStr } = formatForZone(now, tz);
          card.querySelector('.time').textContent = timeStr;
          card.querySelector('.date').textContent = dateStr;
        } catch (err) {
          // If the timezone is invalid, show an error and style accordingly
          card.querySelector('.time').textContent = 'Fuseau invalide';
          card.querySelector('.date').textContent = '';
        }
      });
    }

    // Add a new zone (from select or text input)
    function addZone(id) {
      if (!id) return;
      // normalize
      id = id.trim();
      // local is special
      if (id.toLowerCase() === 'local') id = 'local';

      // avoid duplicates
      if (zones.some(z => z.id.toLowerCase() === id.toLowerCase())) {
        alert('Ce fuseau est déjà affiché.');
        return;
      }

      // Validate by trying to construct Intl formatter (some browsers throw RangeError for unknown tz)
      try {
        // we test by formatting current time in that TZ
        if (id !== 'local') {
          new Intl.DateTimeFormat(undefined, { timeZone: id });
        }
      } catch (err) {
        alert('Fuseau invalide. Utilisez un fuseau IANA valide (ex: Europe/Paris).');
        return;
      }

      zones.push({ id, label: id === 'local' ? 'Heure locale' : id });
      renderZones();
    }

    // Wire UI
    addBtn.addEventListener('click', () => {
      const val = customInput.value || presetSelect.value;
      addZone(val);
      customInput.value = '';
    });

    // Handle Enter key in text input
    customInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        addBtn.click();
      }
    });

    // Initialize
    renderZones();
    // Update every second (synchronized to clock)
    function startTick() {
      // Align next tick to the next full second to avoid drift
      const now = Date.now();
      const msToNextSecond = 1000 - (now % 1000);
      setTimeout(() => {
        updateTimes();
        setInterval(updateTimes, 1000);
      }, msToNextSecond);
    }
    startTick();
  </script>
</body>
</html>
